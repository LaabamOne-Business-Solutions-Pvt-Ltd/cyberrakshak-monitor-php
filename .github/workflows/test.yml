name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The tests talk to tests/fake-server.mjs (127.0.0.1 only), which needs Node.js. They load the class through
    # Composer's autoloader, as an app does; then again with no php.ini (no curl, no mbstring).
    name: 'PHP ${{ matrix.php }} on ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - { os: windows-latest, php: '8.4' }
          - { os: macos-latest, php: '8.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - name: No curl, no mbstring (php -n)
        run: php -n tests/run.php
